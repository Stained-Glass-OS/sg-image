# Stained Glass OS -- bootable image.
#
# Debian trixie with Wine installed system-wide and a session that boots
# straight into Wine's explorer as the shell.
#
# This is deliberately a plain amd64 image with no i386 multiarch. See ADR 0002
# in the stained-glass repo: 64-bit Windows apps work, 32-bit ones do not, and
# buying 32-bit support costs either multiarch or a custom Wine build. Phase 0
# does not need it, so Phase 0 does not pay for it.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
Output=sg-image
OutputDirectory=build

[Content]
Bootable=yes
Hostname=stained-glass

# Serial console as well as tty, so a headless QEMU boot is debuggable when the
# gate fails and there is no screen to look at.
#
# systemd.firstboot=off is not optional. Without it systemd-firstboot runs its
# interactive wizard on the first boot of a fresh image -- "Please configure
# your system! -- Press any key to proceed" -- and the boot stops dead there,
# forever, on a machine with nobody at the keyboard. Everything below that is
# also pre-seeded so the wizard has nothing left to ask about.
KernelCommandLine=console=ttyS0 console=tty0 systemd.show_status=yes systemd.firstboot=off

Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootShell=/bin/bash

# The package list is kept free of inline comments on purpose: commentary
# between continuation lines is not reliably stripped, and a comment silently
# parsed as a package name is a miserable thing to debug.
#
# Contents, by group:
#   base       systemd, kernel, networking, certificates
#   wine       *Not* Debian's Wine. The image installs wine-sg from its .deb
#              (staged into the extra tree), built with
#              --enable-archs=i386,x86_64 so a pure amd64 machine runs 32-bit
#              Windows applications. See ADR 0005. What is listed here is the
#              set of libraries wine-sg links against directly -- apt resolves
#              the rest. Keep this in step with wine-sg's own Depends.
#   session    greetd, cage, XWayland, Mesa and fonts, plus the two packages
#              that make a graphical login work at all:
#                login           provides /etc/pam.d/login, which
#                                /etc/pam.d/greetd @includes. Without it greetd
#                                dies at pam_start and crash-loops.
#                libpam-systemd  provides pam_systemd, which creates the logind
#                                session and XDG_RUNTIME_DIR that cage needs
#                                for its seat and its Wayland socket.
#              sg-session itself is not here: it is installed from its .deb by
#              mkosi.postinst.chroot, for the reason explained at ExtraTrees.
#   domain     one image, two roles: winbind/krb5 for a domain member, and
#              samba-ad-dc and samba-ad-provision (the AD schema; apt would
#              bring it as a Recommends, mkosi does not) for the DC
#              role sg-dc-provision turns on. Every Samba service is disabled
#              in mkosi.postinst.chroot until a role asks for it. cifs-utils
#              and keyutils mount a member's network drives with the user's
#              Kerberos ticket (sg-netmountd: cifs.upcall, request-key).
#   d3d        Vulkan for DXVK and VKD3D-Proton. mesa-vulkan-drivers brings
#              lavapipe, a software ICD, so Direct3D works -- slowly -- on a
#              machine with no GPU, including the QEMU guest the gate runs in.
#              Without an ICD every DXVK DLL fails at device creation and the
#              translation layers are dead weight.
#   remote     sdl-freerdp3, the native client sg-shell's Remote Desktop
#              Connection (sg-mstsc) starts: the outbound half of RDP. The SDL
#              client, because it prompts for the password and certificate trust
#              in its own dialogs -- started from the desktop there is no
#              terminal to prompt on, and the password must not travel on a
#              command line.
#   updates    PackageKit, whose offline updates install what sg-update-prepare
#              downloaded on the next boot, before anyone logs in -- the
#              Windows/PureOS pattern. Its apt backend reads the same sources
#              `apt` does. apt itself and the Debian archive keyring, so the
#              sources in mkosi.extra/etc/apt verify and an administrator can
#              use apt directly.
#   installer  what sg-install needs on the live system: systemd-repart to
#              partition and copy, e2fsprogs to give the copy its own UUID
#   test       ssh access and process tools for the boot gate
Packages=
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        udev
        dbus-broker
        linux-image-amd64
        util-linux
        systemd-repart
        e2fsprogs
        iproute2
        less
        ca-certificates
        libvulkan1
        vulkan-tools
        libasound2t64
        libavcodec61
        libavformat61
        libavutil59
        libcapi20-3t64
        libglib2.0-0t64
        libgphoto2-6t64
        libgphoto2-port12t64
        libgstreamer1.0-0
        libgstreamer-plugins-base1.0-0
        libpcap0.8t64
        libpcsclite1
        libpulse0
        libsane1
        libudev1
        libunwind8
        libusb-1.0-0
        libwayland-client0
        libwayland-egl1
        libx11-6
        libxext6
        libxkbcommon0
        libxkbregistry0
        ocl-icd-libopencl1
        greetd
        login
        libpam-systemd
        cage
        xwayland
        x11-utils
        libgl1-mesa-dri
        mesa-vulkan-drivers
        fonts-liberation
        winbind
        libnss-winbind
        libpam-winbind
        samba-common-bin
        krb5-user
        samba-ad-dc
        samba-ad-provision
        smbclient
        cifs-utils
        keyutils
        bind9-host
        freerdp3-sdl
        packagekit
        packagekit-tools
        sudo
        apt
        debian-archive-keyring
        openssh-server
        procps
        psmisc

# Generated, not committed. 'make image' populates this tree with:
#   root/.ssh/authorized_keys   the throwaway key the boot gate logs in with
#   opt/sg-packages/*.deb       wine-sg and sg-session, built from the sibling
#                               repos
#
# Both are installed by mkosi.postinst with dpkg rather than through
# mkosi's PackageDirectories mechanism. That mechanism only regenerates its
# local apt repository when the repository directory's mtime changes, so on
# repeat builds the .deb is copied over an existing file, the directory mtime
# does not move, reprepro never runs, and apt fails with "Unable to locate
# package sg-session" -- intermittently, depending on what the previous build
# left behind. Extra trees are copied in unconditionally, immediately before
# postinst scripts run, so this route is deterministic. All of sg-session's
# dependencies are installed by apt above, so dpkg has nothing left to resolve.
ExtraTrees=build/extra-tree

# Phase 0 images are disposable lab machines reached over ssh with a generated
# key. There is no password login at all: see mkosi.extra/etc/ssh/sshd_config.d.
RootPassword=
