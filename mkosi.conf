# Stained Glass OS -- bootable image.
#
# Debian trixie with Wine installed system-wide and a session that boots
# straight into Wine's explorer as the shell.
#
# This is deliberately a plain amd64 image with no i386 multiarch. See ADR 0002
# in the stained-glass repo: 64-bit Windows apps work, 32-bit ones do not, and
# buying 32-bit support costs either multiarch or a custom Wine build. Phase 0
# does not need it, so Phase 0 does not pay for it.

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,contrib,non-free-firmware

[Output]
Format=disk
Output=sg-image
OutputDirectory=build

[Content]
Bootable=yes
Hostname=stained-glass

# Serial console as well as tty, so a headless QEMU boot is debuggable when the
# gate fails and there is no screen to look at.
#
# systemd.firstboot=off is not optional. Without it systemd-firstboot runs its
# interactive wizard on the first boot of a fresh image -- "Please configure
# your system! -- Press any key to proceed" -- and the boot stops dead there,
# forever, on a machine with nobody at the keyboard. Everything below that is
# also pre-seeded so the wizard has nothing left to ask about.
KernelCommandLine=console=ttyS0 console=tty0 systemd.show_status=yes systemd.firstboot=off

Locale=C.UTF-8
Keymap=us
Timezone=UTC
RootShell=/bin/bash

# The package list is kept free of inline comments on purpose: commentary
# between continuation lines is not reliably stripped, and a comment silently
# parsed as a package name is a miserable thing to debug.
#
# Contents, by group:
#   base       systemd, kernel, networking, certificates
#   wine       'wine' pulls wine64 on amd64 and provides /usr/bin/wine via
#              Debian alternatives. DXVK is packaged; VKD3D-Proton is not in
#              Debian at all (Debian's vkd3d is Wine's own, a different
#              project), so it is absent here -- see docs/packages.md.
#   session    greetd, cage, XWayland, Mesa and fonts, plus the two packages
#              that make a graphical login work at all:
#                login           provides /etc/pam.d/login, which
#                                /etc/pam.d/greetd @includes. Without it greetd
#                                dies at pam_start and crash-loops.
#                libpam-systemd  provides pam_systemd, which creates the logind
#                                session and XDG_RUNTIME_DIR that cage needs
#                                for its seat and its Wayland socket.
#              sg-session itself is not here: it is installed from its .deb by
#              mkosi.postinst.chroot, for the reason explained at ExtraTrees.
#   domain     winbind/krb5 client bits, staged for Phase 2 and unused today
#   test       ssh access and process tools for the boot gate
Packages=
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        udev
        dbus-broker
        linux-image-amd64
        util-linux
        iproute2
        less
        ca-certificates
        wine
        wine64
        dxvk
        dxvk-wine64
        greetd
        login
        libpam-systemd
        cage
        xwayland
        x11-utils
        libgl1-mesa-dri
        mesa-vulkan-drivers
        fonts-liberation
        winbind
        libnss-winbind
        libpam-winbind
        samba-common-bin
        krb5-user
        openssh-server
        procps
        psmisc

# Generated, not committed. 'make image' populates this tree with:
#   root/.ssh/authorized_keys   the throwaway key the boot gate logs in with
#   opt/sg-packages/*.deb       sg-session, built from the sibling repo
#
# sg-session is installed by mkosi.postinst with dpkg rather than through
# mkosi's PackageDirectories mechanism. That mechanism only regenerates its
# local apt repository when the repository directory's mtime changes, so on
# repeat builds the .deb is copied over an existing file, the directory mtime
# does not move, reprepro never runs, and apt fails with "Unable to locate
# package sg-session" -- intermittently, depending on what the previous build
# left behind. Extra trees are copied in unconditionally, immediately before
# postinst scripts run, so this route is deterministic. All of sg-session's
# dependencies are installed by apt above, so dpkg has nothing left to resolve.
ExtraTrees=build/extra-tree

# Phase 0 images are disposable lab machines reached over ssh with a generated
# key. There is no password login at all: see mkosi.extra/etc/ssh/sshd_config.d.
RootPassword=
