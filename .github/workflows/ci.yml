name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot-gate:
    name: build image + boot gate
    runs-on: ubuntu-latest
    # This job now builds Wine from source as well as the image, then boots it
    # under TCG. On a 4-core runner that is slow; budget accordingly.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          path: sg-image

      - name: Check out sg-session
        uses: actions/checkout@v4
        with:
          repository: Stained-Glass-OS/sg-session
          path: sg-session

      - name: Check out wine-sg
        uses: actions/checkout@v4
        with:
          repository: Stained-Glass-OS/wine-sg
          path: wine-sg

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            systemd-repart systemd-boot-efi \
            debian-archive-keyring dosfstools e2fsprogs mtools \
            qemu-system-x86 qemu-utils ovmf openssh-client \
            debhelper build-essential devscripts shellcheck \
            gcc-mingw-w64-i686 gcc-mingw-w64-x86-64 mingw-w64-tools \
            patch xz-utils file
          # wine-sg is built from source as part of 'make image', so the image
          # job needs Wine's build dependencies too.
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update
          sudo apt-get build-dep -y --no-install-recommends wine || true
          sudo apt-get install -y --no-install-recommends libsane-dev
          # Ubuntu's mkosi lags, and the image config uses behaviour (the
          # .chroot postinst extension, mkosi.repart handling) that differs
          # between versions. Pin to the version this was developed and tested
          # against rather than taking whatever the runner happens to ship.
          # mkosi is not published to PyPI; it installs from its git tag.
          pipx install "git+https://github.com/systemd/mkosi.git@v25.3"
          mkosi --version

          # mkosi needs bootctl on the host to produce an EFI-bootable image.
          # Which package ships it depends on the distribution -- Debian splits
          # it into systemd-boot-tools, Ubuntu does not have that package at
          # all -- so try the candidates and check for the binary rather than
          # hardcoding a name that is right on one distro and absent on the
          # other.
          if ! command -v bootctl >/dev/null; then
            for pkg in systemd-boot-tools systemd-boot systemd; do
              sudo apt-get install -y --no-install-recommends "$pkg" 2>/dev/null || continue
              command -v bootctl >/dev/null && break
            done
          fi
          command -v bootctl || { echo "bootctl still missing; the image cannot be made bootable"; exit 1; }
          bootctl --version | head -1

      - name: Allow unprivileged user namespaces
        # mkosi builds unprivileged, via a user namespace. Ubuntu's AppArmor
        # blocks those for unconfined binaries by default, and mkosi fails at
        # become_root() with EPERM. Relaxing the restriction is preferable to
        # running the whole build as root, which would leave root-owned output
        # that the gate then cannot read.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || \
            echo "sysctl not present; assuming user namespaces are already allowed"

      - name: Report accelerator
        # GitHub's Linux runners expose /dev/kvm on larger images only. The gate
        # falls back to TCG with a longer budget; this step just makes the log
        # say which one happened, so a slow run is not a mystery.
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available"
          else
            echo "No KVM: the gate will run under TCG (slow)"
          fi

      - name: Build image
        working-directory: sg-image
        run: make image

      - name: Boot gate
        working-directory: sg-image
        run: make boot-test

      - name: Upload gate artifacts
        # The screenshot is the point. Upload it whether or not the gate passed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-gate-artifacts
          path: |
            sg-image/build/artifacts/
          if-no-files-found: warn
