# mkosi's default is Minimize=guess, which sizes the root partition to just fit
# the installed content. That leaves a filesystem with essentially no free
# space, and the first thing this image does on boot is build a Wine prefix --
# which promptly fails with "No space left on device", taking the session with
# it.
#
# 8G of room instead. The .raw is sparse, so the file on disk stays about the
# size of its contents; only the declared partition is larger.
[Partition]
Type=root
Format=ext4
CopyFiles=/
Minimize=off
SizeMinBytes=8G
