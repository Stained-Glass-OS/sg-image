# Stained Glass OS: our own splash (mkosi.extra/usr/share/plymouth/themes),
# shown at once -- a quiet boot shows nothing else. At device scale 1: the
# theme scales itself to the display scale the screen recommends, crisp
# (sg-session's stained-glass.script; sg-boot-splash sets the same on
# installed machines).
[Daemon]
Theme=stained-glass
ShowDelay=0
DeviceTimeout=8
DeviceScale=1
